<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcorza | Login Seguro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 24px; text-align: center; width: 320px; backdrop-filter: blur(10px); }
        .logo { font-weight: 600; letter-spacing: 3px; margin-bottom: 30px; color: #00f0ff; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #333; background: #111; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #00f0ff; color: black; font-weight: 600; cursor: pointer; }
        button:hover { box-shadow: 0 0 20px #00f0ff; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">ALCORZA</div>
        <p style="font-size: 0.8rem; color: #888;">Introduce tu clave de acceso</p>
        <input type="password" id="pass" placeholder="Contraseña">
        <button onclick="checkAccess()">Entrar al Sistema</button>
        <p id="error" style="color: red; font-size: 0.8rem; margin-top: 10px; display: none;">Clave incorrecta</p>
    </div>

    <script>
        function checkAccess() {
            const p = document.getElementById('pass').value;
            // Tu contraseña por ahora será "Alcorza2026"
            if(p === "Alcorza2026") {
                localStorage.setItem('alcorza_auth', 'true');
                window.location.href = "dashboard.html";
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
