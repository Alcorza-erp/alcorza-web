<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcorza | ERP Operativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --sidebar: #0a0a0a; --accent: #00f0ff; --card: rgba(255,255,255,0.03); --text: #ffffff; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        nav { width: 260px; background: var(--sidebar); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 30px 20px; }
        .nav-item { padding: 15px; border-radius: 12px; margin-bottom: 5px; cursor: pointer; color: #888; text-decoration: none; display: block; }
        .nav-item.active { background: var(--card); color: var(--accent); }
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; }
        .stat-card h4 { margin: 0; color: #888; font-weight: 400; }
        .stat-card h2 { margin: 10px 0 0; font-size: 1.8rem; color: var(--accent); }
        
        /* Zona de Carga */
        .upload-zone {
            border: 2px dashed rgba(0, 240, 255, 0.2);
            padding: 40px;
            text-align: center;
            border-radius: 24px;
            background: rgba(0, 240, 255, 0.02);
            margin-bottom: 30px;
            transition: 0.3s;
            cursor: pointer;
        }
        .upload-zone:hover { border-color: var(--accent); background: rgba(0, 240, 255, 0.05); }
        #file-input { display: none; }
        
        .ai-console { background: rgba(112, 0, 255, 0.05); border: 1px solid rgba(112, 0, 255, 0.1); padding: 25px; border-radius: 20px; }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 600; font-size: 1.2rem; margin-bottom: 40px; color: var(--accent);">ALCORZA <span style="font-size: 0.6rem; border: 1px solid; padding: 2px 5px; border-radius: 4px;">ERP</span></div>
        <a href="#" class="nav-item active">Dashboard Fiscal</a>
        <a href="#" class="nav-item">Nómina</a>
        <a href="#" class="nav-item">Expedientes</a>
    </nav>

    <main>
        <h1>Consola de **Procesamiento**</h1>
        
        <div class="upload-zone" onclick="document.getElementById('file-input').click()">
            <p>📥 Arrastra tus facturas XML del SAT aquí o haz clic para subir</p>
            <input type="file" id="file-input" accept=".xml" multiple>
        </div>

        <div class="grid">
            <div class="stat-card">
                <h4>Total Facturado (Subtotal)</h4>
                <h2 id="total-facturado">$0.00</h2>
            </div>
            <div class="stat-card">
                <h4>IVA Trasladado</h4>
                <h2 id="total-iva">$0.00</h2>
            </div>
            <div class="stat-card">
                <h4>Total con Impuestos</h4>
                <h2 id="total-final" style="color: #7000ff;">$0.00</h2>
            </div>
        </div>

        <div class="ai-console">
            <div id="ai-message">🤖 Esperando archivos para analizar...</div>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('file-input');
        
        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            let subtotalGlobal = 0;
            let ivaGlobal = 0;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(event.target.result, "text/xml");
                    
                    // Lógica para leer atributos del CFDI (SAT México)
                    const comprobante = xmlDoc.getElementsByTagName("cfdi:Comprobante")[0];
                    if (comprobante) {
                        const subtotal = parseFloat(comprobante.getAttribute("SubTotal")) || 0;
                        const total = parseFloat(comprobante.getAttribute("Total")) || 0;
                        const iva = total - subtotal;

                        subtotalGlobal += subtotal;
                        ivaGlobal += iva;

                        // Actualizar UI
                        document.getElementById('total-facturado').innerText = `$${subtotalGlobal.toLocaleString('es-MX')}`;
                        document.getElementById('total-iva').innerText = `$${ivaGlobal.toLocaleString('es-MX')}`;
                        document.getElementById('total-final').innerText = `$${(subtotalGlobal + ivaGlobal).toLocaleString('es-MX')}`;
                        document.getElementById('ai-message').innerText = `🤖 IA: He procesado ${files.length} factura(s) con éxito. Todo parece en orden fiscalmente.`;
                    }
                };
                reader.readAsText(file);
            });
        });
    </script>
</body>
</html>
